
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Portals Quiz</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111;
      color: #fff;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    .timer {
      font-size: 16px;
      margin-bottom: 8px;
      color: #ffeb3b;
    }
    .question {
      font-size: 18px;
      margin-bottom: 16px;
    }
    .answers {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      background: #333;
      color: #fff;
      text-align: left;
    }
    button:hover {
      background: #444;
    }
    button:disabled {
      background: #222;
      color: #888;
      cursor: default;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      color: #8bc34a;
    }
    .final {
      margin-top: 16px;
      font-size: 16px;
      color: #ffeb3b;
    }
  </style>
</head>
<body>
  <h2 id="playerTitle">Player</h2>
  <div class="timer" id="timer">Time left: --s</div>
  <div class="question" id="questionText"></div>

  <div class="answers">
    <button id="btnA" onclick="sendAnswer('A')"></button>
    <button id="btnB" onclick="sendAnswer('B')"></button>
    <button id="btnC" onclick="sendAnswer('C')"></button>
    <button id="btnD" onclick="sendAnswer('D')"></button>
  </div>

  <div class="status" id="status"></div>
  <div class="final" id="finalResult"></div>

  <script>
    // GOOGLE SCRIPT BACKEND URL
    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycbzfVaLiI1ls5UQjhVzRzVqxxeq92r8XsP4AP3gP_pUJyq3y3f_3dc-PsJhVsOUI5OdQyQ/exec";

    // QUIZ SETTINGS
    const PRE_START_SECONDS = 5;
    const TIMER_SECONDS = 10;

    let QUIZ_ID = "Q1";
    let PLAYER_ID = "Player";
    let QUESTIONS = [];
    let currentIndex = 0;
    let timer = null;
    let timeLeft = TIMER_SECONDS;
    let startTime = 0;
    let answering = false;

    // Read URL parameters
    const params = new URLSearchParams(window.location.search);
    if (params.get("player")) PLAYER_ID = params.get("player");
    if (params.get("quiz")) QUIZ_ID = params.get("quiz");

    document.getElementById("playerTitle").textContent = "Player: " + PLAYER_ID;

    // Load quiz from backend
    async function loadQuiz() {
      document.getElementById("status").textContent = "Loading quiz...";

      try {
        const res = await fetch(
          BACKEND_URL + "?mode=getQuiz&quiz=" + encodeURIComponent(QUIZ_ID)
        );

        const data = await res.json();

        if (!data.questions || data.questions.length === 0) {
          document.getElementById("status").textContent =
            "Error: No questions received.";
          return;
        }

        QUESTIONS = data.questions;
        document.getElementById("status").textContent =
          "Quiz loaded! Starting soon...";

        startPreCountdown();
      } catch (err) {
        document.getElementById("status").textContent =
          "Error loading quiz. Tell the host.";
      }
    }

    // PRE-COUTDOWN
    function startPreCountdown() {
      let pre = PRE_START_SECONDS;
      const timerEl = document.getElementById("timer");
      timerEl.textContent = "Quiz starts in: " + pre + "s";

      const interval = setInterval(() => {
        pre--;
        timerEl.textContent = "Quiz starts in: " + pre + "s";

        if (pre <= 0) {
          clearInterval(interval);
          startQuestion();
        }
      }, 1000);
    }

    // SHOW QUESTION
    function startQuestion() {
      answering = true;
      timeLeft = TIMER_SECONDS;

      const q = QUESTIONS[currentIndex];
      document.getElementById("questionText").textContent =
        q.id + ". " + q.text;

      document.getElementById("btnA").textContent = "A. " + q.A;
      document.getElementById("btnB").textContent = "B. " + q.B;
      document.getElementById("btnC").textContent = "C. " + q.C;
      document.getElementById("btnD").textContent = "D. " + q.D;

      enableButtons();

      startTime = Date.now();
      updateTimer();
    }

    // TIMER
    function updateTimer() {
      const timerEl = document.getElementById("timer");
      timerEl.textContent = "Time left: " + timeLeft + "s";

      timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = "Time left: " + timeLeft + "s";

        if (timeLeft <= 0) {
          clearInterval(timer);
          answering = false;
          disableButtons();
          sendAnswer("NO_ANSWER");
        }
      }, 1000);
    }

    function disableButtons() {
      ["btnA", "btnB", "btnC", "btnD"].forEach((id) => {
        document.getElementById(id).disabled = true;
      });
    }
    function enableButtons() {
      ["btnA", "btnB", "btnC", "btnD"].forEach((id) => {
        document.getElementById(id).disabled = false;
      });
    }

    // SEND ANSWER
    async function sendAnswer(letter) {
      if (!answering) return;
      answering = false;
      clearInterval(timer);
      disableButtons();

      const elapsed = Date.now() - startTime;

      document.getElementById("status").textContent = "Submitting...";

      try {
        await fetch(
          BACKEND_URL +
            "?mode=answer" +
            "&quiz=" +
            QUIZ_ID +
            "&q=" +
            QUESTIONS[currentIndex].id +
            "&player=" +
            encodeURIComponent(PLAYER_ID) +
            "&a=" +
            letter +
            "&t=" +
            elapsed
        );
      } catch (e) {}

      document.getElementById("status").textContent = "Answer submitted!";

      // NEXT QUESTION
      setTimeout(() => {
        currentIndex++;
        if (currentIndex >= QUESTIONS.length) {
          showFinal();
        } else {
          startQuestion();
        }
      }, 800);
    }

    // SHOW FINAL MESSAGE
    async function showFinal() {
      document.getElementById("questionText").textContent = "Quiz finished!";
      document.getElementById("timer").textContent = "";

      // Fetch player result
      const res = await fetch(
        BACKEND_URL +
          "?mode=playerResult&quiz=" +
          QUIZ_ID +
          "&player=" +
          encodeURIComponent(PLAYER_ID)
      );
      const data = await res.json();

      let txt =
        "Final score: " +
        data.score +
        " points<br>Rank: " +
        data.rank +
        "<br>";

      if (data.isWinner && data.code) {
        txt += "<br><b>WINNER! Your access code:</b><br>" + data.code;
      }

      document.getElementById("finalResult").innerHTML = txt;
    }

    // START EVERYTHING
    loadQuiz();
  </script>
</body>
</html>
