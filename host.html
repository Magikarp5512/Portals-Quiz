<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Host Panel</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#111; color:#fff; padding:20px; }
    button { padding:10px 16px; font-size:16px; cursor:pointer; border:none; border-radius:6px; background:#2196f3; color:#fff; }
    #status { margin-top:12px; font-size:14px; }
  </style>
</head>
<body>
  <h3>Start Quiz</h3>
  <p>Once every player has entered a username, click below.</p>
  <button id="startBtn">Start in 15 seconds</button>
  <div id="status"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const QUIZ_ID = params.get("quiz") || "Q1";
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxJoP_wyAcHY4eBYQ0XXZSMFaA80Jeny19W6O6ZjJdf8XRRmNZyjQv0K_MOZcgrMbQdBg/exec";

    document.getElementById("startBtn").onclick = async () => {
      document.getElementById("status").textContent = "Sending start signal...";
      try {
        await fetch(
          `${BACKEND_URL}?mode=hostStart&quiz=${encodeURIComponent(QUIZ_ID)}`,
          { method: "GET", mode: "no-cors" }
        );
        document.getElementById("status").textContent = "Quiz starting in ~15s!";
      } catch (err) {
        document.getElementById("status").textContent = "Could not reach backend. Try again.";
      }
    };
  </script>
</body>
</html>
